# Config of docker/deploy-docker.sh (bash, sourced). The only per-app deploy config.
# A variable that the environment should be able to override must use the form `: "${VAR:=value}"`.
APP={{kit.name}}                 # image name = <APP>-<service>, compose project at /srv/<APP>
SERVICES="web"                   # dirs with a Dockerfile (1 dir = 1 image)
TAG_PREFIX=""                    # tag variable in .env = <TAG_PREFIX><SERVICE upper-case>_TAG
DEPLOY_HOST={{kit.deployHost}}   # ssh alias of the host that runs the containers
DEPLOY_USER={{kit.deployUser}}
PULL_REGISTRY={{kit.registry}}   # registry the deploy host pulls from (same value as in docker-compose.yml)
# Tests before build = `npm run gate` (the script's default). No tests at all: `: "${TEST_CMD=}"` plus the reason.
# Smoke after the containers are healthy (must answer 2xx/3xx); empty = off:
: "${SMOKE_URL=https://{{kit.name}}.{{kit.deployDomain}}/}"
