# Opt-in CI for nuxt-base: the same check as the local gate, plus the secret scan and dependency audit.
# Actions are pinned by commit SHA (the comment names the release) and gitleaks by version + checksum: nothing here
# changes unless this file changes. `npm ci` installs exactly what the committed lockfile says.
name: gate
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_<version>_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # nuxt-base only: its test:smoke step runs the layer's playwright suite, which needs a browser on the runner.
      - run: npx playwright install --with-deps chromium
      # The secret scan is part of gate:ci, and in CI a missing gitleaks binary FAILS it (locally it is a notice).
      - name: install gitleaks (pinned release, checksum verified)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run gate:ci
      # nuxt-base only: CI runs the T1 pair (GATE.md tiers) — gate is inside gate:ci, smoke here. The full suite
      # (gate:full + gate:kit) is the pre-release check on a dev machine / the weekly kit-gate job.
      - run: npm run test:smoke
